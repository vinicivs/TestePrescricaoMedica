apiVersion: v1
kind: Service
metadata:
  name: prescription-mysql
  labels:
    app: prescription-mysql
spec:
  clusterIP: None
  selector:
    app: prescription-mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prescription-mysql
spec:
  serviceName: prescription-mysql
  replicas: 1
  selector:
    matchLabels:
      app: prescription-mysql
  template:
    metadata:
      labels:
        app: prescription-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: prescriptions
            - name: MYSQL_USER
              value: prescription_app
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: prescription-db, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: prescription-db, key: MYSQL_PASSWORD }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: mysql-init
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
