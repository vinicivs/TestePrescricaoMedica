apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-web
  labels:
    app: prescription-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: prescription-web
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: prescription-web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/OWNER/REPO/prescription-web:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_URL
              value: http://prescription-api:8080
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: prescription-web
spec:
  selector:
    app: prescription-web
  ports:
    - name: http
      port: 80
      targetPort: http
